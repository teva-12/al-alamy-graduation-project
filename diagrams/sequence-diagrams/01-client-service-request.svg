@startuml D11_ClientServiceRequest
skinparam backgroundColor White
skinparam defaultFontName Helvetica
skinparam defaultFontColor #2C2C2A
skinparam shadowing false
skinparam sequenceArrowThickness 1.2
skinparam sequence {
  ArrowColor #185FA5
  ArrowFontColor #2C2C2A
  ArrowFontSize 11
  LifeLineBorderColor #185FA5
  LifeLineBackgroundColor #E6F1FB
  ParticipantBorderColor #185FA5
  ParticipantBackgroundColor #E6F1FB
  ParticipantFontColor #17324A
  ParticipantFontStyle bold
  ActorBorderColor #185FA5
  ActorBackgroundColor #E6F1FB
  BoxBorderColor #9A9A94
  BoxBackgroundColor #F7F7F5
}
skinparam note {
  BackgroundColor #F1EFE8
  BorderColor #5F5E5A
}
skinparam sequenceGroupBackgroundColor #F1EFE8
skinparam sequenceGroupBorderColor #9A9A94
skinparam sequenceGroupFontColor #2C2C2A
skinparam sequenceDividerBackgroundColor #F1EFE8
skinparam databaseBackgroundColor #E6F1FB
skinparam databaseBorderColor #185FA5
title Al-Alamy - Client Service Request Sequence Diagram

actor Client
participant "Al-Alamy Web\nApplication" as Web
participant "Authentication\nService" as Auth
participant "Service Management\nModule" as SvcMgmt
participant "Request Management\nModule" as ReqMgmt
participant "Notification\nService" as Notif
participant "Al-Alamy Team" as Team

Client -> Web: Login
Web -> Auth: Validate Credentials
Auth - -> Web: Authenticated

Client -> Web: Browse Services
Web -> SvcMgmt: Get Available Services
SvcMgmt - -> Web: Services List
Web - -> Client: Display Services

Client -> Web: Select Service
Client -> Web: Enter Business Information\nand Requirements
Web -> Web: Validate Request

Web -> ReqMgmt: Create Service Request
ReqMgmt -> ReqMgmt: Store Request
ReqMgmt - -> Web: Request Created

Web -> Notif: Notify Al-Alamy Team
Notif -> Team: New Service Request Notification

Team -> Web: Open Request
Web -> ReqMgmt: Get Request Details
ReqMgmt - -> Web: Request Details
Web - -> Team: Display Request Details

@enduml

