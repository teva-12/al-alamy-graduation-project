.5,587.8672,394.5,583.8672" style="stroke: #185FA5; stroke-width: 1.0;"/><text fill="#2C2C2A" font-family="Helvetica" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="129" x="394.5" y="553.4683">Update Meeting Status</text><text fill="#2C2C2A" font-family="Helvetica" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="87" x="394.5" y="566.2729">to Rescheduled</text><polygon fill="#185FA5" points="563.5,606.6719,573.5,610.6719,563.5,614.6719,567.5,610.6719" style="stroke: #185FA5; stroke-width: 1.0;"/><line style="stroke: #185FA5; stroke-width: 1.2;" x1="387.5" x2="569.5" y1="610.6719" y2="610.6719"/><text fill="#2C2C2A" font-family="Helvetica" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="164" x="394.5" y="606.0776">Send Alternative Time Notice</text><polygon fill="#185FA5" points="56.5,633.4766,46.5,637.4766,56.5,641.4766,52.5,637.4766" style="stroke: #185FA5; stroke-width: 1.0;"/><line style="stroke: #185FA5; stroke-width: 1.2; stroke-dasharray: 2.0,2.0;" x1="50.5" x2="574.5" y1="637.4766" y2="637.4766"/><text fill="#2C2C2A" font-family="Helvetica" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="150" x="62.5" y="632.8823">Alternative Time Proposed</text><!--MD5=[fca686e529e6fa69090e3a34c3072bcd]
@startuml D12_MeetingRequest
skinparam backgroundColor White
skinparam defaultFontName Helvetica
skinparam defaultFontColor #2C2C2A
skinparam shadowing false
skinparam sequenceArrowThickness 1.2
skinparam sequence {
  ArrowColor #185FA5
  ArrowFontColor #2C2C2A
  ArrowFontSize 11
  LifeLineBorderColor #185FA5
  LifeLineBackgroundColor #E6F1FB
  ParticipantBorderColor #185FA5
  ParticipantBackgroundColor #E6F1FB
  ParticipantFontColor #17324A
  ParticipantFontStyle bold
  ActorBorderColor #185FA5
  ActorBackgroundColor #E6F1FB
  BoxBorderColor #9A9A94
  BoxBackgroundColor #F7F7F5
}
skinparam note {
  BackgroundColor #F1EFE8
  BorderColor #5F5E5A
}
skinparam sequenceGroupBackgroundColor #F1EFE8
skinparam sequenceGroupBorderColor #9A9A94
skinparam sequenceGroupFontColor #2C2C2A
skinparam sequenceDividerBackgroundColor #F1EFE8
skinparam databaseBackgroundColor #E6F1FB
skinparam databaseBorderColor #185FA5
title Al-Alamy - Meeting Request Sequence Diagram

actor Client
participant "Web Application" as Web
participant "Meeting Management\nModule" as MeetMgmt
participant "Notification\nService" as Notif
participant "Al-Alamy Team" as Team

Client -> Web: Request Meeting\n(preferred time, purpose)
Web -> MeetMgmt: Validate and Create\nMeeting Request
MeetMgmt - -> Web: Meeting Request Created

Web -> Notif: Notify Al-Alamy Team
Notif -> Team: Meeting Request Notification

Team -> MeetMgmt: Review Available Time Slots
MeetMgmt - -> Team: Available Time Slots

alt Requested Time Available
  Team -> MeetMgmt: Select Suitable Time
  MeetMgmt -> MeetMgmt: Update Meeting Status\nto Confirmed
  MeetMgmt -> Notif: Send Confirmation
  Notif - -> Client: Meeting Confirmation
else Requested Time Unavailable
  Team -> MeetMgmt: Propose Alternative Time
  MeetMgmt -> MeetMgmt: Update Meeting Status\nto Rescheduled
  MeetMgmt -> Notif: Send Alternative Time Notice
  Notif - -> Client: Alternative Time Proposed
end

@enduml

