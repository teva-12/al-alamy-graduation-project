Length="143" x="207" y="777.562">Task No Longer Available</text><!--MD5=[5b0ea5aa75b0f4d352b4b5f1b69c3b49]
@startuml D13_FirstFreelancerAcceptance
skinparam backgroundColor White
skinparam defaultFontName Helvetica
skinparam defaultFontColor #2C2C2A
skinparam shadowing false
skinparam sequenceArrowThickness 1.2
skinparam sequence {
  ArrowColor #185FA5
  ArrowFontColor #2C2C2A
  ArrowFontSize 11
  LifeLineBorderColor #185FA5
  LifeLineBackgroundColor #E6F1FB
  ParticipantBorderColor #185FA5
  ParticipantBackgroundColor #E6F1FB
  ParticipantFontColor #17324A
  ParticipantFontStyle bold
  ActorBorderColor #185FA5
  ActorBackgroundColor #E6F1FB
  BoxBorderColor #9A9A94
  BoxBackgroundColor #F7F7F5
}
skinparam note {
  BackgroundColor #F1EFE8
  BorderColor #5F5E5A
}
skinparam sequenceGroupBackgroundColor #F1EFE8
skinparam sequenceGroupBorderColor #9A9A94
skinparam sequenceGroupFontColor #2C2C2A
skinparam sequenceDividerBackgroundColor #F1EFE8
skinparam databaseBackgroundColor #E6F1FB
skinparam databaseBorderColor #185FA5
title Al-Alamy - First Freelancer Acceptance Sequence Diagram (Critical Business Rule)

participant "Freelancer A" as FA
participant "Freelancer B" as FB
participant "Al-Alamy Web\nApplication" as Web
participant "Task Management\nModule" as TaskMgmt
database "Database" as DB
participant "Notification\nService" as Notif

TaskMgmt -> Notif: Publish Task
Notif -> FA: Task Opportunity Notification
Notif -> FB: Task Opportunity Notification

FA -> Web: Request Task Acceptance
Web -> TaskMgmt: Accept Task (Freelancer A)

TaskMgmt -> DB: Begin Atomic Transaction
note over TaskMgmt, DB
  The assignment operation must be
  concurrency-safe: only one freelancer
  can successfully claim the task.
end note
TaskMgmt -> DB: Check Task Availability
DB - -> TaskMgmt: Task Available

TaskMgmt -> DB: Assign Task to Freelancer A
DB -> DB: Change Status\nAvailable -> Accepted
DB -> DB: Record Acceptance Timestamp
DB - -> TaskMgmt: Commit Transaction

TaskMgmt - -> Web: Assignment Successful
Web - -> FA: Task Accepted Successfully

FB -> Web: Request Task Acceptance\n(same task)
Web -> TaskMgmt: Accept Task (Freelancer B)
TaskMgmt -> DB: Check Task Availability
DB - -> TaskMgmt: Task Already Assigned
TaskMgmt - -> Web: Acceptance Rejected

Web -> Notif: Notify Freelancer B
Notif - -> FB: Task No Longer Available

@enduml

