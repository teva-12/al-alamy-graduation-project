@startuml D15_ApprovedDeliverableToClient
skinparam backgroundColor White
skinparam defaultFontName Helvetica
skinparam defaultFontColor #2C2C2A
skinparam shadowing false
skinparam sequenceArrowThickness 1.2
skinparam sequence {
  ArrowColor #185FA5
  ArrowFontColor #2C2C2A
  ArrowFontSize 11
  LifeLineBorderColor #185FA5
  LifeLineBackgroundColor #E6F1FB
  ParticipantBorderColor #185FA5
  ParticipantBackgroundColor #E6F1FB
  ParticipantFontColor #17324A
  ParticipantFontStyle bold
  ActorBorderColor #185FA5
  ActorBackgroundColor #E6F1FB
  BoxBorderColor #9A9A94
  BoxBackgroundColor #F7F7F5
}
skinparam note {
  BackgroundColor #F1EFE8
  BorderColor #5F5E5A
}
skinparam sequenceGroupBackgroundColor #F1EFE8
skinparam sequenceGroupBorderColor #9A9A94
skinparam sequenceGroupFontColor #2C2C2A
skinparam sequenceDividerBackgroundColor #F1EFE8
skinparam databaseBackgroundColor #E6F1FB
skinparam databaseBorderColor #185FA5
title Al-Alamy - Approved Deliverable to Client Sequence Diagram

actor Freelancer
participant "Al-Alamy Team" as Team
participant "Review Module" as Review
participant "Project Management\nModule" as ProjMgmt
actor Client
participant "Notification\nService" as Notif
database "Database" as DB

Freelancer -> Review: Submit Work
Team -> Review: Review Submission
Team -> Review: Approve Work

Review -> DB: Update Task Status\nto Approved
Review -> ProjMgmt: Notify Approved Deliverable

ProjMgmt -> DB: Integrate Approved\nDeliverable into Project
ProjMgmt -> DB: Update Project Progress
ProjMgmt -> DB: Update Client-Facing\nProject Information

ProjMgmt -> Notif: Notify Client
Notif - -> Client: Deliverable Available\nNotification

Client -> ProjMgmt: Open Project
ProjMgmt - -> Client: Project Details

Client -> ProjMgmt: View Approved Deliverable
ProjMgmt - -> Client: Deliverable Content

@enduml

